name: Siftroom support request
description: Report a reproducible Siftroom problem without sharing private photos or personal data.
title: "[Support] "
labels:
  - support
body:
  - type: markdown
    attributes:
      value: |
        This is a public issue. Do not include email addresses, original photos, passwords, serial numbers, or other sensitive information.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 26.6.2
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac model
      placeholder: e.g. MacBook Pro with M4 Pro
  - type: input
    id: format
    attributes:
      label: Image format or camera
      placeholder: e.g. Sony ARW / ILCE-7C
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Tell us what you did, what happened, and what you expected.
    validations:
      required: true
